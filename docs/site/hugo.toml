# The documentation site.
#
# It lives in docs/site/ rather than in docs/ itself, and deliberately: docs/
# already holds the project's specification documents, which the README links
# into from forty-six places and which the workflow documents cross-reference.
# A Hugo site rooted there would either collide with them or require moving
# them, and the specifications are the normative documents — they are not
# something to relocate for a website's convenience. The site links out to them
# instead.

# What `hugo server` uses; the docs image (Dockerfile) overrides it with the address it is served at.
baseURL = 'https://docs.artur-rios.tech/orpheus/'
title = 'Orpheus'
locale = 'en-us'
contentDir = 'content/en'
defaultContentLanguage = 'en'
enableRobotsTXT = true

# The theme, as a Hugo module rather than a git submodule. A submodule is a
# second thing to remember to update and a common way for a clone to arrive
# without its theme; a module is a version in go.mod that `hugo mod get` moves.
#
# Bootstrap and Font Awesome are not modules any more: the theme declares them
# as npm packages, and `hugo mod npm pack` writes them into package.json. Moving
# the theme is therefore three commands, not one — `hugo mod get`, then
# `hugo mod npm pack`, then `npm install` — or the stylesheets are built against
# the previous theme's Bootstrap.
[module]
  proxy = 'https://proxy.golang.org'
  [[module.imports]]
    path = 'github.com/docsy/docsy/theme'
  # Declaring any mount replaces Hugo's default mount for that directory, so
  # the site's own directories are mounted here explicitly as well.
  [[module.mounts]]
    source = 'content/en'
    target = 'content'
  [[module.mounts]]
    source = 'static'
    target = 'static'
  [[module.mounts]]
    source = 'layouts'
    target = 'layouts'
  [[module.mounts]]
    source = 'data'
    target = 'data'
  [[module.mounts]]
    source = 'i18n'
    target = 'i18n'
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  # CHANGELOG.md and CONTRIBUTING.md live at the repository root; the site renders them
  # (see layouts/shortcodes/repo-file.html) instead of keeping copies.
  [[module.mounts]]
    source = '../../CHANGELOG.md'
    target = 'assets/repo/CHANGELOG.md'
  [[module.mounts]]
    source = '../../CONTRIBUTING.md'
    target = 'assets/repo/CONTRIBUTING.md'

# Mermaid diagrams are rendered from fenced code blocks, so the diagram in the
# source is the diagram a reader sees — reviewable in a diff rather than an
# image nobody can edit. The same reasoning the icon script is written under.
[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false
    style = 'tango'
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

[params]
  copyright.authors = 'Artur Rios | [Artur Rios Attribution License](https://github.com/artur-rios/orpheus/blob/main/LICENSE)'
  github_repo = 'https://github.com/artur-rios/orpheus'
  github_branch = 'main'
  # The site source sits below the repository root, so "edit this page" has to
  # be told where, or every link points at a path that does not exist.
  github_subdir = 'docs/site'
  version_menu = 'Releases'
  archived_version = false
  version = '1.0.0'
  url_latest_version = 'https://github.com/artur-rios/orpheus/releases/latest'
  offlineSearch = true

  # Mermaid is one of the theme's plugins, and its settings live on the
  # plugin's entry; the theme refuses to build with a `params.mermaid` table
  # left over. It loads only on a page with a diagram.
  [params.docsy.plugins.mermaid]
    # Pinned here rather than left to the theme's own pin, so that a theme
    # upgrade does not also quietly re-render every diagram on the site with a
    # different Mermaid. Moving this is a deliberate act with a diff, and the
    # docs workflow checks the major version it expects.
    version = '11.4.1'

  [params.ui]
    # Light and dark, with a control to choose between them. Left on `auto` for
    # somebody who has expressed no preference, which follows the system — the
    # same rule the application itself follows for its own theme.
    showLightDarkModeMenu = true
    sidebar_menu_compact = false
    sidebar_search_disable = false
    breadcrumb_disable = false
    navbar_logo = true
    footer_about_enable = true

  [params.links]
    [[params.links.user]]
      name = 'Releases'
      url = 'https://github.com/artur-rios/orpheus/releases'
      icon = 'fa fa-download'
      desc = 'Every release, with its downloads'
    [[params.links.developer]]
      name = 'GitHub'
      url = 'https://github.com/artur-rios/orpheus'
      icon = 'fab fa-github'
      desc = 'The source, the specifications and the issues'

[menu]
  [[menu.main]]
    name = 'Downloads'
    weight = 40
    url = '/downloads/'
    pre = '<i class="fa-solid fa-download"></i>'
  [[menu.main]]
    name = 'GitHub'
    weight = 50
    url = 'https://github.com/artur-rios/orpheus'
    pre = '<i class="fab fa-github"></i>'

[languages]
  [languages.en]
    label = 'English'
    weight = 1
    [languages.en.params]
      title = 'Orpheus'
      description = 'A music player for Windows, Linux and Android that plays the files you already own.'

[outputs]
  home = ['HTML', 'RSS', 'PRINT']
  section = ['HTML', 'RSS', 'PRINT']
