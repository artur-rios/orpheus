name: Verify

# The half of "test it on all platforms" that Jenkins cannot do: Windows and the setup executable. The Linux and
# Android half is the check `linux` (ci/linux.sh in yggdrasil.yml), run by Jenkins.
#
# tools/verify.sh and tools/verify.ps1 each verify what their host can verify and say plainly what they skipped. The
# `linux` check and this workflow are what make the skips add up to nothing: between them every target is built, and
# --strict / -Strict makes a runner that quietly failed to build something it was supposed to build a failing job
# rather than a green one with a warning.
#
# This job is the catalog's actionsCheck "Windows and the installer". The pull requests live on Forgejo and the
# GitHub mirror only receives pushes, so it runs on a push to every branch (Jenkins copies the result for the pull
# request's head commit), with no pull_request and no paths filter.

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  # Renovate does not track this one. Keep it equal to FLUTTER_VERSION in ci/flutter-env.sh and to the one in
  # release-windows.yml, and bump the three together.
  FLUTTER_VERSION: 3.47.2

jobs:
  windows:
    name: Windows and the installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # The runner image carries Inno Setup already; installed explicitly so
      # that a change to the image is a clear failure here rather than a
      # confusing one inside the packaging script.
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      # Only Windows and the installer. Android is built by the `linux` check,
      # and building it twice buys nothing but minutes.
      - name: Verify
        run: .\tools\verify.ps1 -Only windows -Installer -Strict
        shell: pwsh

      - uses: actions/upload-artifact@v7
        with:
          name: orpheus-windows-setup
          path: dist/orpheus-setup-*.exe
          if-no-files-found: error
