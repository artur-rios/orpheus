# Analyzer configuration. `flutter_lints` is the base set, with the strict
# language modes and the rules this project holds itself to layered on top.
#
# There is no "known warnings" list. The moment there is one, warnings stop
# being read.

include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Both catalogs stay complete in both languages. A missing translation is a
    # build failure, not a string that renders as its key.
    missing_required_param: error
    missing_return: error

  exclude:
    # Generated output is not hand-edited. It is exercised through the code
    # that uses it.
    - lib/core/l10n/generated/**
    - build/**
    - android/**
    - linux/**
    - windows/**

  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # Colours, spacing and typography come from the theme. These catch the
    # mechanical half; the guard test in test/core/theme/ catches a literal
    # Color(...) written into a widget.
    - avoid_field_initializers_in_const_classes
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - unnecessary_parenthesis

    - avoid_dynamic_calls
    - cast_nullable_to_non_nullable

    # Every failure is surfaced. A swallowed exception is the one thing the
    # failure model cannot map.
    - only_throw_errors
    - unawaited_futures

    # Documentation on the public surface every feature consumes.
    - public_member_api_docs
