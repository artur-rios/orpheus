name: orpheus
description: "A cross-platform music player for Windows, Linux and Android."
publish_to: "none"
version: 1.0.1+2

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Composition root and state management. The same choice the Alexandria UI
  # made, for the same reason: the player outlives the screen that started it,
  # so the queue has to live somewhere that is not a widget.
  flutter_riverpod: ^3.0.0

  # The playback engine. libmpv-backed, and the one engine in this class that
  # covers all three targets — Windows, Linux and Android — with the same API
  # and the same container and codec range, without transcoding anything.
  media_kit: ^1.2.6
  media_kit_libs_audio: ^1.0.7

  # Tags and embedded cover art, in pure Dart. Pure Dart matters here: it is
  # the one component that would otherwise need a native build per target, and
  # a reader that cannot run in a test is a reader whose parsing nobody checks.
  audio_metadata_reader: ^1.7.1

  # Where the catalog, the settings and the cover cache live on each platform.
  path: ^1.9.1
  path_provider: ^2.1.6

  # The local settings store: library folders, layout, theme, resume positions.
  shared_preferences: ^2.5.5

  # The lyrics lookup. `http` rather than a bare `HttpClient` from dart:io for
  # one reason that matters to this project more than convenience: its
  # `Client` is an interface, so the one call this application makes over a
  # network is a seam a test can stand in front of. No test here opens a
  # socket.
  http: ^1.6.0

  # The share sheet, for handing a rendered story card to whatever the owner
  # posts with. Mobile only in use: the desktops save the picture through the
  # file dialog `file_picker` already provides, which is what an owner there
  # actually wants — a file they can attach, not a list of applications.
  share_plus: ^13.3.0

  # The SHA-256 of a downloaded update, checked against the SHA256SUMS.txt the
  # release publishes beside it. Already in the tree as somebody else's
  # transitive dependency; named here because this application now depends on
  # it directly, and the one thing that must never silently change version is
  # the thing deciding whether a downloaded executable is the one that was
  # built.
  crypto: ^3.0.6

  # What the running build calls itself, which is the other half of the update
  # check: a release is only newer than something, and that something is this.
  # A plugin rather than a constant generated from `pubspec.yaml`, because a
  # constant is a second place to remember to change and this reads the version
  # the build actually carries.
  package_info_plus: ^10.2.1

  # Structured logging.
  logging: ^1.3.0

  # Localization for en and pt-BR.
  intl: ^0.20.2

  # The folder picker. `file_picker` rather than `file_selector` because this
  # application has a mobile target: `getDirectoryPath` is the one call the
  # library-folder flow needs, and only this package answers it on Android as
  # well as on the two desktops.
  file_picker: ^12.2.0

  # Android's audio-media read permission. Asked for on Android and nowhere
  # else — the desktops have no such gate.
  permission_handler: ^13.0.1

  # The Android media session: the foreground service that keeps playback
  # alive once the application is backgrounded, and the notification and lock
  # screen controls that come with it. Android alone — it covers no desktop,
  # which is why it sits behind an interface with a silent implementation for
  # the two that have no such thing.
  audio_service: ^0.18.19

  # Audio focus, which arrives through the same seam: the phone call that
  # should pause playback, and the headphones pulled out that should too.
  audio_session: ^0.2.4

  # The desktop window: the minimum size, and the geometry that is restored
  # between runs. Desktop-only by nature, and guarded as such at every call.
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
